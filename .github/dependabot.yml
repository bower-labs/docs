# Keeps the SHA-pinned GitHub Actions current. Every action is pinned to a full
# commit SHA with its version as a trailing comment (the org's Actions policy
# requires it, so a tag ref fails at run time); Dependabot bumps both. Grouped
# into one monthly PR to keep review and CI churn low.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ['*']
